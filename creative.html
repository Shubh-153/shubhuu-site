<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.add('js');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative | Shubh Gupta</title>
<meta name="description" content="Photography and Video Editing portfolio by Shubh Gupta.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Locked to Dark Theme for a premium gallery aesthetic */
    --bg: #111216;
    --bg-raised: #1A1D24;
    --ink: #F7F7F5;
    --ink-soft: #A09E96;
    --graphite: #6B6558;
    --accent: #6B94FA;
    --accent-soft: #1E283C;
    --line: #2A2D35;
    --shadow: rgba(0,0,0,0.4);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 0 28px;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: var(--accent-soft); color: var(--accent); }

  /* NAV */
  nav {
    padding: 32px 0;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  .back-link { font-family: var(--mono); font-size: 0.85rem; color: var(--ink-soft); transition: color 0.2s; border-bottom: 1px solid transparent; }
  .back-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* HEADER */
  header {
    max-width: 1200px;
    margin: 64px auto 64px;
    text-align: center;
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  p.sub {
    color: var(--ink-soft);
    font-size: 1.05rem;
    max-width: 500px;
    margin: 0 auto;
  }

  /* GALLERY (Masonry layout using CSS Columns) */
  .gallery {
    max-width: 1200px;
    margin: 0 auto 100px;
    column-count: 3;
    column-gap: 24px;
  }
  @media (max-width: 900px) { .gallery { column-count: 2; } }
  @media (max-width: 600px) { .gallery { column-count: 1; } }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: 24px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px var(--shadow);
      border-color: var(--accent);
    }
  }
  
  .gallery-item img, .gallery-item iframe {
    width: 100%;
    display: block;
    border: none;
    background-color: var(--line);
  }
  .gallery-item iframe {
    aspect-ratio: 16 / 9;
  }
  
  .caption {
    padding: 14px 18px;
    font-size: 0.9rem;
    color: var(--ink-soft);
    font-family: var(--sans);
  }

  /* ENTRANCE ANIMATIONS */
  .js .gallery-item {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  .js .gallery-item.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce){
    .js .gallery-item { opacity: 1; transform: none; transition: none !important; }
  }

</style>
</head>
<body>

<nav>
  <a href="/" class="brand">shubh<span style="color:var(--accent)">.</span></a>
  <a href="/" class="back-link">← Back to Code</a>
</nav>

<header>
  <h1>Creative</h1>
  <p class="sub">A collection of my photography and video editing projects.</p>
</header>

<div class="gallery">
  
  <!-- Video Example -->
  <div class="gallery-item">
    <!-- Replace the src with your actual YouTube embed link -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=1" title="YouTube video player" allowfullscreen></iframe>
    <div class="caption">Cinematic Reel 2026</div>
  </div>

  <!-- Image Example (Vertical) -->
  <div class="gallery-item">
    <!-- Replace src with your image file name -->
    <div style="width: 100%; padding-bottom: 130%; display: flex; align-items: center; justify-content: center; color: var(--graphite); font-family: var(--mono); font-size: 0.8rem;">[ Replace with &lt;img src="photo1.jpg"&gt; ]</div>
    <div class="caption">Street Photography - Mumbai</div>
  </div>

  <!-- Image Example (Horizontal) -->
  <div class="gallery-item">
    <!-- Replace src with your image file name -->
    <div style="width: 100%; padding-bottom: 66%; display: flex; align-items: center; justify-content: center; color: var(--graphite); font-family: var(--mono); font-size: 0.8rem;">[ Replace with &lt;img src="photo2.jpg"&gt; ]</div>
    <div class="caption">Landscape - Himalayas</div>
  </div>
  
  <!-- Image Example (Square) -->
  <div class="gallery-item">
    <!-- Replace src with your image file name -->
    <div style="width: 100%; padding-bottom: 100%; display: flex; align-items: center; justify-content: center; color: var(--graphite); font-family: var(--mono); font-size: 0.8rem;">[ Replace with &lt;img src="photo3.jpg"&gt; ]</div>
    <div class="caption">Portrait Session</div>
  </div>

</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let staggerDelay = 0;
      let staggerTimeout;
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            if (staggerDelay > 0) {
              entry.target.style.transitionDelay = `${staggerDelay}ms, ${staggerDelay}ms`;
            }
            entry.target.classList.add('is-visible');
            
            const delaySnapshot = staggerDelay;
            setTimeout(() => { entry.target.style.transitionDelay = ''; }, delaySnapshot + 400);
            
            staggerDelay += 75; // Stagger entrance of photos
            obs.unobserve(entry.target);
          }
        });
        clearTimeout(staggerTimeout);
        staggerTimeout = setTimeout(() => { staggerDelay = 0; }, 100);
      }, { rootMargin: "0px 0px -20px 0px" });
      
      document.querySelectorAll('.gallery-item').forEach(el => observer.observe(el));
    } else {
      document.querySelectorAll('.gallery-item').forEach(el => el.classList.add('is-visible'));
    }
  });
</script>

</body>
</html>
