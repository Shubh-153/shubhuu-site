<style>
  :root {

    --bg-raised: #1A1A1E;

  a{color:inherit;text-decoration:none;}

  ::selection{background:var(--glass-hover);color:var(--ink);}

  /* BACKGROUND GLOW */
  #bg-glow {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('thumbnail.png');
    background-size: cover;
    background-position: center;
    filter: blur(80px) saturate(250%) contrast(1.2);

    z-index: -2;

  }
  .bg-overlay {
    position: fixed;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(135deg, rgba(225, 48, 108, 0.2), rgba(41, 84, 166, 0.2), rgba(131, 58, 180, 0.2), rgba(253, 29, 29, 0.2));
    animation: gradientMove 15s ease-in-out infinite alternate;
    z-index: -1;
  }
  @keyframes gradientMove {
    0% { transform: translate(0%, 0%) rotate(0deg); }
    100% { transform: translate(10%, 10%) rotate(10deg); }

  /* PROFILE & HERO IMAGE */
  .hero-profile-image {
    width: 100vw;

  /* LINKS CONTAINER */
  .links-container {
    width:100%;
    max-width:540px;
    display:flex;
    flex-direction:column;
    gap:16px;
    z-index: 1;

  .link-btn {
    display:flex;
    flex-direction:column;
    width:100%;

      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 0 -4px 10px rgba(255, 255, 255, 0.05),
      inset 0 0 0 1px rgba(255, 255, 255, 0.15);
  }
  
  .link-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    transition: color 0.3s ease;
    position: relative;
  }
  
  /* Expanding Thumbnail Wrapper */
  .link-thumbnail {
    width: 100%;
    height: 0;
    opacity: 0;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    display: flex;

    justify-content: center;

    width: 100%;
    height: 100%;
    object-fit: cover;

        inset 0 0 0 1px rgba(255, 255, 255, 0.2);

  .view-toggle-btn:hover {

      inset 0 1px 1px rgba(255, 255, 255, 0.6),
      inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  }


  /* View Transition individual morphing */
  .link-btn:nth-child(1) { view-transition-name: link-1; }
  .link-btn:nth-child(2) { view-transition-name: link-2; }
  .link-btn:nth-child(3) { view-transition-name: link-3; }
  .link-btn:nth-child(4) { view-transition-name: link-4; }
  .link-btn:nth-child(5) { view-transition-name: link-5; }
  .link-btn:nth-child(6) { view-transition-name: link-6; }
  .link-btn:nth-child(7) { view-transition-name: link-7; }
  .link-btn:nth-child(8) { view-transition-name: link-8; }
  .link-btn:nth-child(9) { view-transition-name: link-9; }
  .link-btn:nth-child(10) { view-transition-name: link-10; }
  ::view-transition-group(*) { animation-duration: 0.5s; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }

  @media (max-width: 799px) {
    .links-container.bento-mode {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .links-container.bento-mode .link-btn {
      padding: 20px 16px;

      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100%;
      min-height: 140px;
    }
    .links-container.bento-mode .link-header {
      flex-direction: column;

    }
    .links-container.bento-mode .link-header > svg {

    .links-container.bento-mode .link-thumbnail {

    .links-container.bento-mode .link-share-btn svg { width: 18px !important; height: 18px !important; opacity: 1 !important; }
    /* Bento Spans for mobile */
    .links-container.bento-mode .link-btn:nth-child(1),
    .links-container.bento-mode .link-btn:nth-child(10) {
      grid-column: span 2;
    }
    
    .links-container.bento-mode .link-btn:hover {
      transform: scale(1.02) translateY(-2px);
    }
    .links-container.bento-mode .link-btn:hover .link-thumbnail {
      height: 80px;
    }
  }
  
  @media (min-width: 800px) {
    .links-container.bento-mode {
      display: grid;

    /* Bento Spans */

      grid-column: span 2;
    }
    
    .links-container.bento-mode .link-btn:hover {

      transform: scale(1.03) translateY(-4px);
    }
    .links-container.bento-mode .link-btn:hover .link-thumbnail {
      height: 120px;
    }
  }

  /* --- SHARE FEATURES --- */
  .global-share {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));

  .global-share:hover {
    transform: scale(1.05);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));

      inset 0 1px 1px rgba(255, 255, 255, 0.6),

  .link-share-btn {
    position: absolute;

  /* MODAL */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s;
  }
  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .modal-content {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    width: 90%;
    max-width: 360px;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    transform: translateY(20px) scale(0.95);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    color: var(--ink);
  }
  .modal-overlay.active .modal-content {
    transform: translateY(0) scale(1);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;

  .modal-title {
    font-family: var(--display);

  .preview-card {
    background: rgba(0,0,0,0.3);

  .preview-icon {

  }
  .preview-info {
    overflow: hidden;
  }
  .preview-info h3 {
    font-size: 1rem; font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .preview-info p {
    font-size: 0.8rem; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  }

  .share-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    text-align: center;
  }
  .share-option {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 0.75rem; color: var(--ink-soft); cursor: pointer;
    background: none; border: none; font-family: var(--sans);
    transition: color 0.2s;
  }
  .share-option:hover {
    color: var(--ink);
  }
  .share-icon-circle {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    transition: transform 0.2s, background 0.2s;
  }
  .share-option:hover .share-icon-circle {
    transform: translateY(-2px);
    background: var(--glass-hover);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

<script>
  let currentShareUrl = '';

  // 1. Inject individual share buttons
  document.querySelectorAll('.link-btn').forEach(btn => {
    const shareBtn = document.createElement('button');
    shareBtn.className = 'link-share-btn';
    shareBtn.setAttribute('aria-label', 'Share this link');
    shareBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>';
    
    const header = btn.querySelector('.link-header');
    header.appendChild(shareBtn);

    shareBtn.addEventListener('click', (e) => {
      e.preventDefault(); 
      e.stopPropagation(); 
      
      let rawUrl = btn.getAttribute('href');
      if (rawUrl.startsWith('/')) rawUrl = 'https://shubhuu.in' + rawUrl;
      
      let title = header.innerText.trim();
      let iconHTML = header.querySelector('svg').outerHTML;
      
      openShareModal(title, rawUrl, iconHTML);
    });
  });

  // 2. Modal Logic
  const modal = document.getElementById('shareModal');
  function openShareModal(title, url, iconHtml) {
    currentShareUrl = url;
    document.getElementById('previewTitle').innerText = title;
    document.getElementById('previewUrl').innerText = url;
    document.getElementById('previewIcon').innerHTML = iconHtml;
    modal.classList.add('active');
  }
  function closeShareModal(e) {
    if(e && e.target !== modal && !e.target.closest('.close-modal')) return;
    modal.classList.remove('active');
  }

  // 3. Share actions
  function shareTo(platform) {
    let shareUrl = '';
    const encodedUrl = encodeURIComponent(currentShareUrl);
    if (platform === 'whatsapp') {
      shareUrl = `https://api.whatsapp.com/send?text=${encodedUrl}`;
    } else if (platform === 'x') {
      shareUrl = `https://twitter.com/intent/tweet?url=${encodedUrl}`;
    } else if (platform === 'linkedin') {
      shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
    }
    if (shareUrl) window.open(shareUrl, '_blank');
    closeShareModal();
  }

  function copyModalLink() {
    navigator.clipboard.writeText(currentShareUrl).then(() => {
      showToast();
      closeShareModal();
    });
  }

  // 4. Global Share Page
  function shareGlobal() {
    const shareData = {
      title: 'Shubh Gupta | Links',
      text: 'Check out all my links!',
      url: 'https://shubhuu.in/links.html'
    };
    if (navigator.share) {
      navigator.share(shareData).catch(console.error);
    } else {
      navigator.clipboard.writeText(shareData.url).then(() => {
        showToast();
      });
    }
  }

  // 5. Toast logic
  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  // 6. View Toggle
  function toggleBentoView() {
    const container = document.querySelector(".links-container");
    
    function updateDOM() {
      const isBento = container.classList.toggle("bento-mode");
      document.querySelector(".icon-desktop").style.display = isBento ? "none" : "block";
      document.querySelector(".icon-phone").style.display = isBento ? "block" : "none";
    }

    // Use View Transitions API for buttery smooth layout morphing
    if (!document.startViewTransition) {
      updateDOM();
      return;
    }
    
    document.startViewTransition(() => updateDOM());
  }

</script>

<script src="liquid-glass.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.link-btn, .global-share').forEach(btn => {
      let glass = null;

      btn.addEventListener('mouseenter', () => {
        if (!glass) {
          glass = liquidGlass(btn, {
            scale: -112,
            chroma: 6,
            blur: 10,
            saturate: 1.5
          });
        }
      });

      btn.addEventListener('mouseleave', () => {
        if (glass) {
          glass.destroy();
          glass = null;
        }
      });

      // Refresh refraction map after hover transitions finish
      btn.addEventListener('transitionend', (e) => {
        if (glass && (e.propertyName === 'height' || e.propertyName === 'margin-top' || e.propertyName === 'border-radius')) {
          glass.refresh();
        }
      });
    });
  });
</script>
