name: Sync Notion Content

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # These steps run sequentially on purpose: fetch-notion.js and
      # fetch-projects.js both read-modify-write index.html (different markers),
      # so they must never run concurrently.
      - name: Sync blogs
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node fetch-notion.js

      - name: Sync projects
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PROJECTS_DB_ID: ${{ secrets.NOTION_PROJECTS_DB_ID }}
        run: node fetch-projects.js

      - name: Sync academics and achievements
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ACADEMICS_DB_ID: ${{ secrets.NOTION_ACADEMICS_DB_ID }}
          NOTION_ACHIEVEMENTS_DB_ID: ${{ secrets.NOTION_ACHIEVEMENTS_DB_ID }}
        run: node fetch-profile.js

      # Runs last so it can see every page the generators produced.
      - name: Rebuild sitemap
        run: node build-sitemap.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync content from Notion"
